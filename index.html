<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Walmart Scanner</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#004f9a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WM Scanner">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--wm:#0071dc;--wmd:#004f9a;--amz:#c45500;--bg:#eef1f5;--card:#fff;--line:#e3e8ef;--fg:#1f2937;--mut:#6b7280;
--good:#15803d;--good-bg:#e7f6ec;--bad:#b91c1c;--bad-bg:#fdecec;--warn:#92400e;--warn-bg:#fff4d6;--grey-bg:#f1f3f6}
@media (prefers-color-scheme: dark){:root{--bg:#0b0f14;--card:#151b23;--line:#263140;--fg:#e5e9ef;--mut:#9aa6b4;--good-bg:#0f2a1b;--bad-bg:#2c1414;--warn-bg:#2b230f;--grey-bg:#1d2530;--good:#4ade80;--bad:#f87171;--warn:#fbbf24}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.top{position:sticky;top:0;z-index:20;background:var(--wmd);padding:calc(10px + env(safe-area-inset-top)) 12px 10px;display:flex;gap:8px;align-items:center}
.top input{flex:1;min-width:0;height:44px;border:0;border-radius:10px;padding:0 12px;font:inherit;font-size:16px;background:#fff;color:#111}
.ib{height:44px;min-width:44px;border:0;border-radius:10px;background:rgba(255,255,255,.18);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:10px 10px 96px}
.sec{background:var(--card);border-radius:12px;margin-top:10px;overflow:hidden;border:1px solid var(--line)}
.sh{display:flex;align-items:center;justify-content:space-between;padding:0 12px;min-height:44px;font-weight:700;font-size:14px;letter-spacing:.02em;cursor:pointer;user-select:none}
.sh .ch{transition:transform .15s;color:var(--mut)}.sec.closed .ch{transform:rotate(-90deg)}.sec.closed .sb{display:none}
.sb{padding:0 12px 12px}
.prod{display:flex;gap:12px}.prod img{width:96px;height:96px;object-fit:contain;background:#fff;border-radius:10px;border:1px solid var(--line);flex:none}
.pt{font-weight:600;font-size:15px}.m{color:var(--mut);font-size:13px}
.ids{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.idc{font:12px ui-monospace,Menlo,monospace;background:var(--grey-bg);border:1px solid var(--line);border-radius:8px;padding:0 8px;min-height:32px;display:inline-flex;align-items:center;cursor:pointer;color:var(--fg)}
.icons{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.icons a,.icons button{min-height:48px;border:1px solid var(--line);border-radius:10px;background:var(--grey-bg);color:var(--fg);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;gap:2px;cursor:pointer}
.icons .ic{font-size:17px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tile{border-radius:10px;padding:8px;background:var(--grey-bg);min-height:62px;display:flex;flex-direction:column;justify-content:center}
.tile .l{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--mut)}
.tile .v{font-size:18px;font-weight:800;margin-top:2px}
.tile.good{background:var(--good-bg)}.tile.good .v{color:var(--good)}.tile.bad{background:var(--bad-bg)}.tile.bad .v{color:var(--bad)}
.tile.warn{background:var(--warn-bg)}.tile.warn .v{color:var(--warn)}
.tile.wide{grid-column:span 2}.tile input{width:100%;font-family:inherit;font-weight:800;font-size:18px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--card);color:var(--fg);min-height:36px}
.verdict{grid-column:1/-1;border-radius:10px;padding:10px 12px;color:#fff}.verdict.buy{background:#15803d}.verdict.skip{background:#b91c1c}
.verdict.check{background:#b45309}
.verdict .vb{font-size:22px;font-weight:800}.verdict .pl{display:inline-block;margin-top:4px;font-size:11.5px;background:rgba(255,255,255,.22);border-radius:6px;padding:1px 6px}
.pbox{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.pbox>div{border-radius:10px;padding:8px 10px;color:#fff}
.pbox .wm{background:var(--wm)}.pbox .az{background:#c45500}.pbox .k{font-size:11px;font-weight:800;letter-spacing:.04em;opacity:.9}
.pbox .p{font-size:20px;font-weight:800;line-height:1.2}.pbox .s{font-size:12.5px;opacity:.95}
.idl{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.idl .idc{min-height:28px;font-size:11.5px;padding:0 7px}
.mine{margin-top:10px;border:2px solid var(--wm);border-radius:10px;padding:8px 10px;font-size:13.5px}.mine b.t{color:var(--wm);font-size:12px;letter-spacing:.04em}
.fb{display:inline-block;font-size:10.5px;font-weight:800;border-radius:5px;padding:0 5px;margin-left:4px;vertical-align:1px}
.fb.wfs{background:var(--wm);color:#fff}.fb.wfsq{background:#dbeafe;color:#1e40af}.fb.sf{background:var(--grey-bg);color:var(--fg);border:1px solid var(--line)}.fb.wm{background:#ffc220;color:#111}.fb.me{background:#16a34a;color:#fff}
tr.wfs td{background:rgba(0,113,220,.08)}
.wb{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}.wb:first-child{border-top:0}
.wb .st{font-weight:700;min-width:92px}.wb .pr{margin-left:auto;font-weight:800;white-space:nowrap}.wb a{color:inherit;text-decoration:none}
.sellp{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px}.copyrow{display:flex;gap:6px;align-items:center;padding:5px 0;border-top:1px solid var(--line);font-size:13px}.copyrow:first-child{border-top:0}
.copyrow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.verdict .vs{font-size:13px;opacity:.95}
.alerts div{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.alerts div:first-child{border-top:0}.dot{width:11px;height:11px;border-radius:50%;flex:none}
.dot.green{background:#16a34a}.dot.yellow{background:#eab308}.dot.red{background:#dc2626}.dot.grey{background:#9ca3af}
.alerts .st{margin-left:auto;color:var(--mut);font-size:13px;text-align:right}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.btn{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:15px;cursor:pointer}
.btn.pri{background:var(--wm);border-color:var(--wm);color:#fff}.btn[disabled]{opacity:.5}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{flex:1;min-height:44px;border:0;background:var(--card);color:var(--fg);font:inherit;font-weight:600}
.seg button.on{background:var(--wm);color:#fff}
.in{min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 10px;font:inherit;font-size:16px;background:var(--card);color:var(--fg);width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.lab{font-size:12px;color:var(--mut);margin-bottom:3px}
.fees div{display:flex;justify-content:space-between;padding:5px 0;border-top:1px solid var(--line);font-size:14px}.fees div:first-child{border-top:0}
.fees .tot{font-weight:800}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;padding:4px 2px}
td{padding:7px 2px;border-top:1px solid var(--line);vertical-align:top}td.r,th.r{text-align:right}
.note{color:var(--mut);font-size:13px;margin-top:8px}.err{background:var(--bad-bg);color:var(--bad);padding:10px;border-radius:10px;margin-top:10px}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav button{position:relative;flex:1;min-height:56px;border:0;background:none;color:var(--mut);font-size:23px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.nav button.on{color:#f97316}.nav button.on::after{content:"";position:absolute;bottom:6px;left:50%;width:26px;margin-left:-13px;height:3px;border-radius:2px;background:#f97316}
.star{border:0;background:none;font-size:26px;line-height:1;min-width:44px;min-height:44px;cursor:pointer;color:#9ca3af}.star.on{color:#f59e0b}
.hrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.hrow:first-child{border-top:0}
.hrow img,.hrow .ph{width:54px;height:54px;object-fit:contain;background:#fff;border-radius:8px;border:1px solid var(--line);flex:none}
.hrow .tx{flex:1;min-width:0;cursor:pointer}.hrow .tt{font-weight:600;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:1px 7px;border-radius:6px;color:#fff;margin-right:4px}.tag.buy{background:#15803d}.tag.skip{background:#b91c1c}.tag.na{background:#9ca3af}
.fbar{display:flex;gap:8px;align-items:center;position:sticky;top:64px;z-index:5;background:var(--bg);padding:8px 0}
.qline{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;min-height:44px}.qline:first-child{border-top:0}
.qline .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.item{padding:10px 0;border-top:1px solid var(--line);cursor:pointer}.item:first-child{border-top:0}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#111;color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;z-index:50;display:none}
.match{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);cursor:pointer;min-height:44px}
.match img{width:52px;height:52px;object-fit:contain;background:#fff;border-radius:6px}
svg text{fill:var(--mut);font-size:10px}
input[type=range]{width:100%}

/* ---- compact SellerAmp-style card (Matt 2026-11-14) ---- */
.wrap{padding:6px 6px 90px}
.sec{border-radius:6px;margin-top:6px}
.sh{min-height:32px;padding:0 8px;font-size:13px;font-weight:700;letter-spacing:0;background:#e9edf2;border-bottom:1px solid var(--line)}
.sh .si{display:inline-block;width:18px;text-align:center;margin-right:5px;font-size:13px}
.sh .ch{display:inline-block;font-size:12px}.sec.closed .ch{transform:rotate(180deg)}.sec.closed .sh{border-bottom:0}
.sb{padding:6px}
.prod{gap:8px}.prod img{width:76px;height:76px;border-radius:6px}
.pt{font-size:14px;line-height:1.25}.m{font-size:12px}
.byl{font-size:12.5px;margin-top:2px;line-height:1.5}.byl .bn{font-weight:800;color:var(--wm);cursor:pointer;text-decoration:underline dotted}
.stag{display:inline-block;font-size:10px;font-weight:800;border-radius:4px;padding:0 5px;margin-left:3px;vertical-align:1px;border:1px solid var(--line);background:var(--grey-bg);color:var(--fg)}
.stag.Retail{background:#e7f6ec;color:#15803d;border-color:#bfe5cb}.stag.Wholesale{background:#e0ecff;color:#1e40af;border-color:#bfd3fb}
.stag.Amazon-native{background:#fff1e6;color:#c2410c;border-color:#fed7aa}.stag.inv{background:#fff4d6;color:#92400e;border-color:#f5dfa0}
.brandbox{margin-top:6px;border:1px solid var(--line);border-radius:6px;padding:6px;font-size:12.5px}
.brandbox .bl{display:flex;gap:6px;padding:3px 0;border-top:1px solid var(--line)}.brandbox .bl:first-of-type{border-top:0}
.brandbox .bl span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icons{display:flex;gap:5px;margin-top:6px}
.icons a,.icons button{flex:none;width:44px;height:38px;min-height:0;border:0;border-radius:6px;background:var(--wm);color:#fff;font-size:8.5px;font-weight:700;gap:0;padding:0}
.icons .ic{font-size:15px;line-height:1.1}
.pbox{gap:6px;margin-top:6px}.pbox>div{border-radius:6px;padding:4px 8px}.pbox .k{font-size:10px}.pbox .p{font-size:16px}.pbox .s{font-size:11.5px}
.idl{gap:4px;margin-top:5px;flex-wrap:nowrap;overflow:hidden}
.idl .idc{min-height:24px;font-size:11px;padding:0 5px;border-radius:5px;white-space:nowrap;gap:3px}.idl .idc .cp{opacity:.6;font-size:11px}
.mine{margin-top:6px;border-width:1px;border-radius:6px;padding:5px 8px;font-size:12.5px}
.tiles{gap:4px}
.tile{border:1px solid var(--line);border-radius:6px;padding:0;min-height:0;background:var(--card);overflow:hidden;justify-content:flex-start}
.tile .l{background:var(--grey-bg);text-align:center;font-size:9.5px;padding:2px 2px;border-bottom:1px solid var(--line);letter-spacing:.02em}
.tile .v{text-align:center;font-size:15px;margin:0;padding:5px 2px;flex:1;display:flex;align-items:center;justify-content:center}
.tile.good .v{background:var(--good-bg)}.tile.bad .v{background:var(--bad-bg)}.tile.warn .v{background:var(--warn-bg)}
.tile.good,.tile.bad,.tile.warn{background:var(--card)}
.tile input{border:0;border-radius:0;text-align:center;font-size:16px;min-height:30px;padding:2px;background:transparent}
.tile.good input{background:var(--good-bg)}.tile.bad input{background:var(--bad-bg)}.tile.warn input{background:var(--warn-bg)}
.tile .apb{display:flex;gap:3px;padding:0 3px 3px;background:var(--warn-bg)}.tile .apb button{flex:1;min-height:24px;font-size:11px;padding:0;border-radius:4px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.tile.warn .v.sm{font-size:12px;padding:3px 2px 2px}
.verdict{border-radius:6px;padding:5px 9px}.verdict .vb{font-size:15px;line-height:1.25}.verdict .vs{font-size:11.5px}
.verdict .pl{margin:2px 0 0;font-size:10.5px}
.row{gap:5px;margin-top:5px}.btn{min-height:36px;padding:0 10px;border-radius:6px;font-size:14px}
.acts{display:flex;gap:4px;margin-top:5px}.acts .btn{min-height:34px;font-size:13.5px;padding:0 8px}
.alerts{border:1px solid var(--line);border-radius:6px;overflow:hidden}
.alerts div{padding:4px 6px;gap:6px;font-size:12.5px;border-top:1px solid var(--line)}
.alerts div:nth-child(even){background:var(--grey-bg)}
.alerts .an{flex:0 0 46%;border-right:1px solid var(--line);display:flex;align-items:center;gap:6px;align-self:stretch}
.alerts .st{margin-left:0;flex:1;text-align:left;font-size:12px;color:var(--fg)}.dot{width:9px;height:9px}
.seg button{min-height:34px;font-size:13.5px}.in{min-height:36px;border-radius:6px}.lab{font-size:11px;margin-bottom:1px}.grid2{gap:5px}
.fees div{padding:3px 0;font-size:12.5px}.note{font-size:11.5px;margin-top:5px}
.wb{padding:5px 0;font-size:12.5px}.wb .st{min-width:80px}
/* offers grid */
.otog{display:flex;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:5px;width:max-content}
.otog button{border:0;background:var(--card);color:var(--fg);font:inherit;font-size:12.5px;font-weight:600;padding:5px 12px;min-height:30px}.otog button.on{background:var(--wm);color:#fff}
table.og{width:100%;table-layout:fixed;border:1px solid #cfd6df;border-collapse:collapse;font-size:12px}
.og th{background:#eef1f5;color:var(--fg);font-size:10.5px;text-transform:none;font-weight:700;padding:4px 3px;border:1px solid #cfd6df;text-align:center}
.og td{padding:3px 3px;border:1px solid #dde3ea;vertical-align:middle;text-align:center;overflow:hidden}
.og tr:nth-child(even) td{background:#f7f9fb}.og td.n{color:var(--mut);font-size:11px}
.og .sn{display:block;font-size:10px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.og .pr{font-weight:700}.og .sub{display:block;font-size:10px;color:var(--mut);white-space:nowrap}
.og .pos{color:var(--good);font-weight:700}.og .neg{color:var(--bad);font-weight:700}
.tb{display:inline-block;font-size:10px;font-weight:800;border-radius:4px;padding:1px 4px;line-height:1.3}
.tb.WFS{background:#16a34a;color:#fff}.tb.WFSq{background:#bbf7d0;color:#14532d}.tb.SF{background:#e7d3b1;color:#5b4320}.tb.WM{background:#ffc220;color:#111}
.tb.na{background:#e5e7eb;color:#4b5563}.tb.YOU{background:#0071dc;color:#fff}
.opg{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:5px;font-size:12px}.opg button{min-height:30px;min-width:40px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);font-size:15px}
.ofoot{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:5px;font-size:12px;font-weight:700}
@media (prefers-color-scheme: dark){.sh{background:#1d2530}.og th{background:#1d2530;border-color:#263140}.og td{border-color:#263140}.og tr:nth-child(even) td{background:#18202a}table.og{border-color:#263140}}

/* tighter pass: Product Details + Quick Info on the first iPhone screen */
.sh{min-height:28px}.sb{padding:5px 6px}.sec{margin-top:5px}.wrap{padding-top:4px}
.prod img{width:64px;height:64px}.pt{font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.byl{font-size:12px;margin-top:1px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tagl{font-size:11.5px;color:var(--mut);margin-top:1px;line-height:1.5}.tagl .stag{margin:0 3px 0 0}
.icons{margin-top:4px;gap:4px}.icons a,.icons button{width:40px;height:32px;font-size:8px}.icons .ic{font-size:13px}
.pbox{margin-top:5px}.pbox>div{padding:3px 7px;display:flex;align-items:baseline;gap:5px;flex-wrap:wrap}.pbox .k{font-size:9.5px}.pbox .p{font-size:15px}.pbox .s{font-size:11px}
.idl{margin-top:4px}.idl .idc{min-height:22px;font-size:10.5px}
.mine{margin-top:4px;padding:3px 7px;font-size:11.5px;line-height:1.35}.mine b.t{font-size:10.5px}
.tile .l{font-size:9px;padding:1px 2px}.tile .v{font-size:14px;padding:3px 2px}.tile input{min-height:26px;font-size:16px}
.tile .apb button{min-height:20px;font-size:10.5px}.tile.warn .v.sm{font-size:11.5px;padding:2px 2px 1px}
.verdict{padding:4px 8px}.verdict .vb{font-size:14.5px}.verdict .vs{font-size:11px;line-height:1.25}
.acts .btn{min-height:32px}
.pbox>div{flex-wrap:nowrap;white-space:nowrap;overflow:hidden}.pbox .s{overflow:hidden;text-overflow:ellipsis;min-width:0}
.tile .apb{padding:0 3px 2px}.tile .apb button{min-height:18px;font-size:10px;line-height:1}.tile.warn .v.sm{font-size:11px;padding:1px 2px 1px}
.sec{margin-top:4px}.sb{padding:4px 6px}
.g3{grid-template-columns:repeat(3,1fr)}.g3 .in{min-height:32px;padding:0 6px}.g3>div:last-child{grid-column:span 2}.seg button{min-height:30px}.fees{margin-top:5px!important}
</style>

<body>
<div class="top">
  <input id="q" type="search" inputmode="search" placeholder="UPC, product name or ASIN" autocomplete="off" enterkeyhint="search">
  <button class="ib" id="bBar" title="Scan barcode (live camera)" aria-label="Scan barcode">▥</button>
  <button class="ib" id="bLens" title="Photo search (no barcode, 1 search)" aria-label="Photo search">🔎</button>
</div>
<input type="file" id="fBar" accept="image/*" capture="environment" hidden>
<input type="file" id="fLens" accept="image/*" capture="environment" hidden>
<div class="wrap">
  <div id="vScan"><div class="note" id="hello">Tap ▥ to scan a barcode with the camera, 🔎 for Photo search (no barcode), or type a UPC / name above.</div><div id="out"></div></div>
  <div id="vHome" hidden></div>
  <div id="vQuick" hidden></div>
  <div id="vHist" hidden></div>
  <div id="vSet" hidden></div>
</div>
<div class="nav">
  <button data-v="vHome" aria-label="Home" title="Home">⌂</button>
  <button data-v="vScan" class="on" aria-label="Scan" title="Scan">▥</button>
  <button data-v="vQuick" aria-label="Quick Scan" title="Quick Scan">⚡</button>
  <button data-v="vHist" aria-label="History" title="History">🕘</button>
  <button data-v="vSet" aria-label="Settings" title="Settings">⚙</button>
</div>

<script>
// The page is static (GitHub Pages, no keys). Everything goes through the Apps Script backend (WMR_API, config.js),
// which checks the scanner password on every call. The password is typed once per device and kept on that device;
// an old scanner link hands it over in the #hash (never sent to any server).
var API = window.WMR_API, K = '', STORES = [], CFG = null, CARD = null, LASTPHOTO = null;
(function () {
  var m = location.hash.match(/[#&]k=([^&]+)/);
  try { if (m) { K = decodeURIComponent(m[1]); localStorage.setItem('wmr_k', K); } else K = localStorage.getItem('wmr_k') || ''; } catch (e) { if (m) K = decodeURIComponent(m[1]); }
  if (m) history.replaceState(null, '', location.pathname);
})();
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); }
function usd(v) { return v == null || v === '' || isNaN(v) ? '–' : (v < 0 ? '-$' : '$') + Math.abs(Number(v)).toFixed(2); }
function num(v) { return v == null || v === '' || isNaN(v) ? '–' : Number(v).toLocaleString(); }
function pct(v) { return v == null || !isFinite(v) ? '–' : Math.round(v * 100) + '%'; }
function call(action, args, key) {
  return fetch(API, {method: 'POST', redirect: 'follow', headers: {'Content-Type': 'text/plain;charset=utf-8'},
                     body: JSON.stringify({api: action, k: key || K, args: args || {}})})
    .catch(function () { throw new Error('No connection to the scanner backend. Check the signal and try again.'); })
    .then(function (r) { if (!r.ok) throw new Error('Scanner backend error ' + r.status); return r.json(); })
    .then(function (j) { if (!j.ok) throw new Error(j.error || 'Error'); return j.r; });
}
function toast(t) { var e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { e.style.display = 'none'; }, 1600); }
function busy(t) { show('vScan'); $('out').innerHTML = '<div class="note">' + esc(t) + '</div>'; }
function fail(e) {
  var t = String(e && e.message || e);
  if (/Not authorized/.test(t)) { try { localStorage.removeItem('wmr_k'); } catch (x) {} K = ''; askKey('The scanner password changed. Type the new one.'); return; }
  $('out').innerHTML = '<div class="err">' + esc(t) + '</div>';
}
function lsGet(k, d) { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

// ---------------------------------------------------------- money (same rules as the robot; instant on edits)
function referral(cat, price) {
  var f = CFG.fees, c = String(cat || '').toLowerCase();
  for (var k in f.referral_by_category) if (c.indexOf(k) >= 0) return f.referral_by_category[k];
  if (price <= f.referral_low_price_max && f.referral_low_price_categories.some(function (k) { return c.indexOf(k) >= 0; })) return f.referral_low_price_pct;
  return f.referral_default;
}
function wfsFee(w) {
  var f = CFG.fees; w = w || f.wfs_default_weight_lb;
  for (var i = 0; i < f.wfs_tiers.length; i++) { var cap = f.wfs_tiers[i][0], fee = f.wfs_tiers[i][1]; if (w <= cap) return r2(fee + (cap > 4 ? Math.max(0, w - 4) * f.wfs_per_lb_over_4 : 0)); }
  return r2(f.wfs_tiers[f.wfs_tiers.length - 1][1] + (w - 4) * f.wfs_per_lb_over_4);
}
function shipFee(w) { var s = CFG.sf; return r2(Math.max(s.ship_min, s.ship_base + s.ship_per_lb * (w || 1))); }
function r2(v) { return Math.round(v * 100) / 100; }
function cuft(dims) { var d = String(dims || '').match(/[\d.]+/g); return d && d.length >= 3 ? d[0] * d[1] * d[2] / 1728 : null; }
function storageFee(dims, months) {
  var cf = cuft(dims); if (!cf || !months) return {fee: 0, known: !!cf || !months};
  var mo = new Date().getMonth(), s = CFG.wfs_storage, fee = 0;
  for (var i = 0; i < months; i++) fee += cf * ((mo + i) % 12 >= 9 ? s.q4_per_cuft_month : s.per_cuft_month);
  return {fee: r2(fee), known: true};
}
/** Everything the tiles + calculator show, for one method, cost and sale price. */
function calc(st) {
  var p = st.price, ref = referral(st.cat, p), w = st.weight;
  var fulfil = st.method === 'wfs' ? wfsFee(w) : shipFee(w);
  var sto = st.method === 'wfs' ? storageFee(st.dims, st.months) : {fee: 0, known: true};
  var payout = p ? p * (1 - ref) - fulfil - sto.fee : null;
  var landed = st.cost ? st.cost * (1 + st.tax) : null;
  var profit = payout != null && landed ? payout - landed : null;
  return {ref: ref, refAmt: p ? p * ref : null, fulfil: fulfil, storage: sto.fee, storageKnown: sto.known, payout: payout,
          landed: landed, profit: profit, roi: profit != null ? profit / landed : null,
          breakeven: landed ? (landed + fulfil + sto.fee) / (1 - ref) : null,
          maxCost: payout != null ? Math.max(payout, 0) / (1 + CFG.roi) / (1 + st.tax) : null};
}

// ---------------------------------------------------------- scanning: live camera first, a photo as the fallback
// (the page left Google's Apps Script frame on 2026-11-14: that frame's "allow" list has no camera)
function cam(mode) {
  MODE = mode;
  WMR_CAM.open(function (code, info) { go(code, info); }, function (msg) {
    if (!msg) { $('fBar').click(); return; }
    var html = '<div class="err">' + esc(msg) + '</div><div class="row"><button class="btn pri" id="bPhoto" style="flex:1">📷 Take a photo of the barcode</button></div>';
    if (MODE === 'quick' && $('qStat')) $('qStat').innerHTML = html; else { show('vScan'); $('hello').style.display = 'none'; $('out').innerHTML = html; }
    $('bPhoto').onclick = function () { $('fBar').click(); };
  });
}
function validCode(d) { return WMR_DECODE.clean(d, '') || (d.length === 8 ? WMR_DECODE.upcEtoA(d) : null); }
var MODE = 'scan';                 // 'quick' = Quick Scan: one line per item
function go(code, info) {
  LENS = null;
  var c = validCode(String(code || '').replace(/\D/g, ''));
  if (c && info && info.short) {         // short UPC-E barcode: easy to misread, so check before spending a search
    show('vScan'); $('hello').style.display = 'none';
    $('out').innerHTML = sec('chk', 'CHECK THE NUMBER', '<div style="font-size:30px;font-weight:800;letter-spacing:.08em;text-align:center;margin:6px 0">' + esc(info.printed || c) + '</div>' +
      '<div class="note" style="text-align:center">Short barcode. Is this the number printed under it?</div>' +
      '<div class="row"><button class="btn pri" id="bYes" style="flex:1">Yes, look it up</button><button class="btn" id="bNo">No, scan again</button></div>');
    wireSecs();
    $('bYes').onclick = function () { go(c); };
    $('bNo').onclick = function () { cam(MODE); };
    return;
  }
  if (!c) { if (MODE === 'quick') quickLine({title: 'Not a valid barcode: ' + code, tag: 'na'}); else $('out').innerHTML = '<div class="err">That is not a valid UPC-A, EAN-13 or UPC-E barcode (check digit). Type it again.</div>'; return; }
  if (MODE === 'quick') { quickScan(c); return; }
  $('q').value = c; scan({upc: c});
}
function scan(q, force) {
  busy('Checking Walmart, Amazon and the sellers…');
  call('scan', {q: q, force: !!force}).then(render).catch(fail);
}
$('q').onkeydown = function (e) {
  if (e.key !== 'Enter') return;
  var v = this.value.trim(); if (!v) return;
  this.blur(); LENS = null;
  if (/^\d{8}$|^\d{12,13}$/.test(v.replace(/\s/g, ''))) go(v);
  else if (/^B0[A-Z0-9]{8}$/i.test(v)) scan({asin: v.toUpperCase()});
  else scan({name: v});
};
$('bBar').onclick = function () { cam('scan'); };
$('fBar').onchange = async function () {
  var f = this.files[0]; this.value = ''; if (!f) return;
  LASTPHOTO = f;
  if (MODE === 'quick') {
    $('qStat').textContent = 'Reading the barcode…';
    var rq = await WMR_DECODE.decode(f, function (t) { $('qStat').textContent = t; });
    $('qStat').textContent = '';
    if (rq.code) go(rq.code, rq); else quickLine({title: 'No barcode read from the photo - tap ▥ Scan next, or use Photo search', tag: 'na'});
    return;
  }
  busy('Reading the barcode…');
  try {
    var r = await WMR_DECODE.decode(f, function (t) { busy(t); });
    if (r.code) { go(r.code, r); return; }
    $('out').innerHTML = '<div class="err">No barcode could be read from that photo.</div>' +
      '<div class="row"><button class="btn pri" id="bUseLens">Use Photo search instead (1 search)</button><button class="btn" id="bAgain">Take another photo</button><button class="btn" id="bLive">▥ Live camera</button></div>' +
      '<div class="note">Tips: fill the frame with the barcode, hold it flat, avoid glare.</div>';
    $('bUseLens').onclick = function () { lens(LASTPHOTO); };
    $('bAgain').onclick = function () { $('fBar').click(); };
    $('bLive').onclick = function () { cam('scan'); };
  } catch (e) { fail(e); }
};
// ---------------------------------------------------------- Photo search (Google Lens) - only on a tap
$('bLens').onclick = function () { $('fLens').click(); };
$('fLens').onchange = function () { var f = this.files[0]; this.value = ''; if (f) lens(f); };
var LENS = null, LENSPICK = null;        // the last Photo search matches (their stores feed WHERE TO BUY)
function lens(f) {
  $('q').value = ''; LENS = null;
  busy('Identifying the product (1 SerpApi search)…');
  shrink(f, 1000).then(function (data) { return call('photo', {image: data}); }).then(function (r) {
    var ms = r.matches || [];
    if (!ms.length) { fail('Google Lens found no product. Try another angle, or type the barcode.'); return; }
    $('out').innerHTML = sec('lens', 'Which one is it?', '<div class="note">Walmart listings first. Tap the match.</div>' +
      ms.map(function (m, i) { return '<div class="match" data-i="' + i + '">' + (m.thumb ? '<img src="' + esc(m.thumb) + '" alt="">' : '') + '<div><div style="font-size:14px;font-weight:600">' + esc(m.title) +
        '</div><div class="m">' + esc(m.source) + (m.price ? ' · ' + usd(m.price) : '') + (m.wid ? ' · Walmart item' : m.asin ? ' · Amazon item' : '') + '</div></div></div>'; }).join(''));
    wireSecs();
    LENS = ms;
    document.querySelectorAll('.match').forEach(function (el) { el.onclick = function () { var m = ms[+el.dataset.i]; LENSPICK = ms; scan(m.wid ? {wid: m.wid} : m.asin ? {asin: m.asin} : {name: m.title}); }; });
  }).catch(fail);
}
function shrink(file, max) {
  return new Promise(function (ok, bad) {
    var img = new Image(), u = URL.createObjectURL(file);
    img.onload = function () { var s = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); ok(c.toDataURL('image/jpeg', 0.82)); };
    img.onerror = bad; img.src = u;
  });
}

// ---------------------------------------------------------- collapsible sections (remembered per phone)
var OPEN = lsGet('wmr_open', {product: 1, quick: 1, alerts: 1, calc: 1, offers: 1, where: 0, details: 0, charts: 0});
var SEC_ICON = {product: '📦', quick: 'ⓘ', alerts: '⚠', calc: '🧮', offers: '🏷', where: '🛍', details: '☰', charts: '📈'};
function sec(id, title, body, right) {
  var open = OPEN[id] !== 0 && OPEN[id] !== false;
  var ic = SEC_ICON[id] ? '<span class="si">' + SEC_ICON[id] + '</span>' : '';
  return '<div class="sec' + (open ? '' : ' closed') + '" data-s="' + id + '"><div class="sh"><span>' + ic + title + '</span><span>' + (right || '') + ' <span class="ch">▲</span></span></div><div class="sb">' + body + '</div></div>';
}
function wireSecs() {
  document.querySelectorAll('.sec .sh').forEach(function (h) {
    h.onclick = function () { var s = h.parentNode; s.classList.toggle('closed'); OPEN[s.dataset.s] = s.classList.contains('closed') ? 0 : 1; lsSet('wmr_open', OPEN);
      if (s.dataset.s === 'charts' && OPEN.charts && CARD && !CARD._charts) loadCharts();
      if (s.dataset.s === 'where' && OPEN.where && CARD && !CARD._stores) loadStores(false); };
  });
}

// ---------------------------------------------------------- the scan card
var ST = null;      // live calculator state for the open card
var HEAT = /\b(chocolate|candy|gummy|gummies|caramel|fudge|truffle|wax|lip balm|crayons?)\b/i;
var HAZ = /\b(aerosol|flammable|butane|propane|lithium|batter(y|ies)|nail polish|perfume|cologne|hand sanitizer|bleach|lighter)\b/i;
var GENERIC = /^(generic|unbranded|unknown|n\/a|na|none|no brand|oem|various)$/i;
function alertsOf(c) {
  var p = c.product || {}, w = c.walmart || {}, a = c.amazon || {}, s = c.sellers || {}, t = (p.title || '') + ' ' + (w.category || ''), out = [];
  var b = function (l) { return (c.badges || []).some(function (x) { return x.label === l; }); };
  var bnote = function (l) { var x = (c.badges || []).filter(function (x) { return x.label === l; })[0]; return x ? x.note : ''; };
  out.push(['Walmart sells it', s.checked ? (s.walmart_sells ? ['red', 'Yes'] : s.walmart_store ? ['yellow', 'Store only ' + usd(s.walmart_store) + ' (not shipped)'] : ['green', 'No']) : w.found ? (w.sells ? ['red', 'Yes'] : ['grey', 'Unknown']) : ['grey', 'Unknown']]);   // same rule as wmSells()
  var su = supp(c);
  out.push(['Buy Box suppressed', su.known ? (su.likely ? ['yellow', 'Likely (Walmart ' + usd(su.bb) + ' far above Amazon ' + usd(a.price) + ')'] : ['green', 'No']) : ['grey', 'Unknown']]);
  var n = Math.max(s.my_offer ? s.others : (s.count || 0), a.sellers || 0);
  out.push(['Private label', GENERIC.test(String(p.brand || '').trim()) || !p.brand ? ['red', 'Generic brand'] : n >= 3 ? ['green', 'No'] : ['grey', 'Unknown']]);
  var ap = c.approval || {};
  out.push(['Approval needed', ap.status === 'ok' ? ['green', 'No (' + ap.why + ')'] : ap.status === 'needs' ? ['yellow', 'Yes - ' + ap.why] :
    ['yellow', ap.likely ? 'Likely - check Seller app' : 'Check Seller app']]);
  out.push(['Hazmat', HAZ.test(t) ? ['red', 'Possible (' + t.match(HAZ)[0] + ')'] : ['green', 'No']]);
  var summer = [4, 5, 6, 7, 8].indexOf(new Date().getMonth()) >= 0;
  out.push(['Heat-sensitive', HEAT.test(t) ? [summer ? 'red' : 'yellow', summer ? 'Yes - summer now' : 'Yes (summer risk)'] : ['green', 'No']]);
  out.push(['Risky / IP brand', b('Risky category: skip') ? ['red', bnote('Risky category: skip')] : ['green', 'No']]);
  out.push(['Invoice recommended', b('Invoice recommended') ? ['yellow', 'Yes (food-type)'] : ['green', 'Retail receipt OK']]);
  var wt = p.weight_lb, cf = cuft(p.dims), L = CFG.lim, dims = String(p.dims || '').match(/[\d.]+/g);
  var big = dims && dims.length >= 3 && dims.slice(0, 3).map(Number).sort(function (x, y) { return y - x; }).some(function (d, i) { return d > [L.max_l, L.max_w, L.max_h].sort(function (x, y) { return y - x; })[i] + 0.05; });
  out.push(['Size tier / bulky', !wt && !dims ? ['grey', 'Unknown - add size'] : (wt > L.max_lb ? ['red', 'Over ' + L.max_lb + ' lb'] : big ? ['red', 'Bigger than ' + L.max_l + 'x' + L.max_w + 'x' + L.max_h] :
    ['green', (wt ? wt + ' lb' : '? lb') + (cf ? ' · ' + cf.toFixed(2) + ' cu ft' : '')])]);
  var bi = c.brand || {};
  if (bi.mismatch) out.push(['Brand mismatch', ['yellow', 'Check listing: Walmart ' + bi.walmart + ' · Amazon ' + bi.amazon]]);
  out.push(['Kirkland', b('Kirkland') ? ['yellow', 'Kirkland: may be gated on Amazon'] : ['green', 'No']]);
  out.push(['Listing check', b('Listing check') ? ['yellow', 'Check brand, title, pack and images'] : ['green', 'No']]);
  return out;
}
function render(c, keep) {      // keep: redraw the same card without losing the cost / price / method typed in
  var was = keep && CARD === c && ST ? {price: ST.price, cost: ST.cost, method: ST.method, tax: ST.tax, months: ST.months} : null;
  if (CARD !== c) OFF = {page: 0, f: 'all'};
  CARD = c; show('vScan'); $('hello').style.display = 'none';
  var p = c.product || {}, w = c.walmart || {}, a = c.amazon || {}, s = c.sellers || {};
  ST = {price: (c.sell || {}).price || null, cost: c.saved ? c.saved.cost : null, method: CFG.method, tax: CFG.tax,
        months: CFG.storage_months, qty: 1, cat: w.category || a.category, weight: p.weight_lb, dims: p.dims};
  if (was) Object.assign(ST, was);
  var al = alertsOf(c), nAl = al.filter(function (x) { return x[1][0] === 'red' || x[1][0] === 'yellow'; }).length;

  var rating = w.reviews ? '★ ' + (w.rating || '–') + ' (' + num(w.reviews) + ' WM)' : a.rating ? '★ ' + a.rating + ' (' + num(a.reviews) + ' AMZ)' : 'No reviews';
  var wUrl = w.wid ? 'https://www.walmart.com/ip/' + encodeURIComponent(w.wid) : 'https://www.walmart.com/search?q=' + encodeURIComponent(p.upc || p.title);
  var aUrl = a.asin ? 'https://www.amazon.com/dp/' + a.asin : 'https://www.amazon.com/s?k=' + encodeURIComponent(p.upc || p.title);

  var sUrl = 'https://sas.selleramp.com/sas/lookup?SasLookup%5Bsearch_term%5D=' + encodeURIComponent(a.asin || p.upc || '');
  var mUrl = CFG.msp ? CFG.msp.replace('{wid}', encodeURIComponent(w.wid || '')).replace('{upc}', encodeURIComponent(p.upc || '')).replace('{asin}', encodeURIComponent(a.asin || '')) : '';
  var icon = function (href, ic, l) { return href ? '<a target="_blank" rel="noopener" href="' + esc(href) + '" title="' + l + '" aria-label="' + l + '"><span class="ic">' + ic + '</span>' + l + '</a>' : '<button data-a="msp" title="' + l + '" aria-label="' + l + '"><span class="ic">' + ic + '</span>' + l + '</button>'; };
  var nOthers = s.checked ? (s.my_offer ? s.others : s.count) : null;
  var wBox = '<div class="wm"><div class="k">WALMART</div><div class="p">' + (w.found || s.bb_price ? usd(s.bb_price || w.price) : 'Not listed') + '</div><div class="s">' +
    (s.checked ? num(nOthers) + ' seller' + (nOthers === 1 ? '' : 's') + (s.my_offer ? ' + you' : '') : w.found ? 'sellers not checked' : 'first to sell?') + (s.store_price_note ? ' · store price' : '') + '</div></div>';
  var aBox = '<div class="az"><div class="k">AMAZON</div><div class="p">' + (a.found === false ? 'Not found' : a.loaded === false ? '–' : usd(a.price)) + '</div><div class="s">' +
    (a.sold ? num(a.sold) + '/mo sold' : a.loaded === false ? 'not loaded' : 'sales unknown') + '</div></div>';
  var mi = c.mine || {};
  var mineBox = mi.mine ? '<div class="mine"><b class="t">IN YOUR CATALOG</b> · <b>' + esc(mi.status) + '</b> · ' + esc(mi.sku) + ' · ' + usd(mi.price) +
    ' · stock ' + (mi.stock_wfs != null ? num(mi.stock_wfs) + ' WFS' + (mi.stock_self ? ' + ' + num(mi.stock_self) + ' SF' : '') : num(mi.stock_self != null ? mi.stock_self : mi.stock)) +
    (s.my_offer || mi.bb_winning != null ? '<br>Buy Box: ' + (mi.bb_winning === true ? '<b style="color:var(--good)">you win it</b>' : mi.bb_winning === false ? '<b style="color:var(--bad)">not yours</b> (Buy Box ' + usd(mi.bb_price) + ')' : 'not in the report yet') +
      (mi.bb_report ? ' <span class="m">· Walmart report ' + esc(mi.bb_report) + '</span>' : '') : '') + '</div>' : '';
  var chip = function (l, v) { return v ? '<span class="idc" data-copy="' + esc(v) + '"><b>' + l + '</b> ' + esc(v) + ' <span class="cp">⧉</span></span>' : ''; };
  var bi = c.brand || {}, bname = bi.name || p.brand || '';
  var byl = '<div class="byl">by ' + (bname ? '<span class="bn" id="bBrand">' + esc(bname) + '</span>' : '–') + (cat ? ' | ' + esc(cat) : '') +
    '</div>' + (bi.mismatch ? '<div class="m" style="color:var(--warn)">Brand mismatch: Walmart <b>' + esc(bi.walmart) + '</b> · Amazon <b>' + esc(bi.amazon) + '</b> — check listing</div>' : '');
  var tagl = '<div class="tagl">' + (bi.source ? '<span class="stag ' + esc(bi.source) + '" title="' + esc(bi.source_why || '') + '">' + esc(bi.source) + '</span>' : '') +
    (bi.invoice ? '<span class="stag inv">Invoice recommended</span>' : '') + esc(p.pack) + ' · ' + rating + (c.cached ? ' · saved' : '') + '</div>';
  var product = '<div class="prod">' + (p.image ? '<img src="' + esc(p.image) + '" alt="">' : '') + '<div style="min-width:0"><div class="pt">' + esc(p.title || 'Unknown product') + '</div>' + byl +
    tagl +
    '<div class="icons">' + icon(wUrl, '🛒', 'Walmart') + icon(aUrl, 'a', 'Amazon') + icon(gUrl, 'G', 'Google') + icon(sUrl, '📈', 'SAS') + icon(mUrl, '👥', 'MSP') + '</div></div></div>' +
    '<div id="brandBox"></div>' +
    '<div class="pbox">' + wBox + aBox + '</div>' +
    '<div class="idl">' + chip('UPC', p.upc) + chip('ASIN', a.asin) + chip('WM', w.wid) + '</div>' + mineBox;
  var quick = '<div class="tiles" id="tiles"></div><div class="acts"><button class="btn" id="bSkip">Skip</button><button class="btn pri" id="bWill" style="flex:1">★ Will Buy</button>' +

  var q = HQ.toLowerCase(), list = HIST.filter(function (h) {
    return (!HSTAR || h.starred) && (!q || (h.title + ' ' + h.upc + ' ' + h.asin + ' ' + h.query).toLowerCase().indexOf(q) >= 0); });
  if (q || HSTAR) {                                   // filtering: one row per item, with how many times it was scanned
    var seen = {}, g = [];
    list.forEach(function (h) { var k = h.upc || h.wid || h.asin || h.query; if (seen[k]) { seen[k].n++; return; } seen[k] = Object.assign({}, h, {n: 1}); g.push(seen[k]); });
    list = g;
  }
  var rows = list.map(function (h) {
    var mb = Math.max(parseFloat(h.mb_wfs) || 0, parseFloat(h.mb_self) || 0);
    return {title: h.title || h.query, img: h.image, upc: h.upc, asin: h.asin, wid: h.wid, star: h.starred, tag: h.verdict,
            sub: h.when + (h.upc ? ' · UPC ' + h.upc : '') + (h.asin ? ' · ' + h.asin : '') + (mb ? ' · max ' + usd(mb) : '') + (h.n > 1 ? ' · scanned ' + h.n + '×' : '')};
  });
  $('vHist').innerHTML = '<div class="fbar"><input class="in" id="hQ" type="search" placeholder="Search title, brand, UPC" value="' + esc(HQ) + '" style="flex:1">' +
    '<button class="star' + (HSTAR ? ' on' : '') + '" id="hStar" title="Only starred">' + (HSTAR ? '★' : '☆') + '</button></div>' +
    sec('hist', 'HISTORY (' + rows.length + ')', rows.length ? rows.map(function (x, i) { return rowHtml(x, i, 'H'); }).join('') : '<div class="note">Nothing matches.</div>');
  wireSecs();
  var qi = $('hQ'); qi.oninput = function () { HQ = qi.value; var pos = qi.selectionStart; drawHist(); var n = $('hQ'); n.focus(); n.setSelectionRange(pos, pos); };
  $('hStar').onclick = function () { HSTAR = !HSTAR; drawHist(); };
  document.querySelectorAll('#vHist .hrow .tx').forEach(function (el) { el.onclick = function () { openItem(rows[+el.parentNode.dataset.i]); }; });
  document.querySelectorAll('#vHist [data-star]').forEach(function (b) { b.onclick = function () {
    var x = rows[+b.dataset.star], on = !x.star;
    call('star', {card: {upc: x.upc, asin: x.asin, wid: x.wid, title: x.title}, on: on}).then(function () {
      HIST.forEach(function (h) { if ((x.upc && upc12(h.upc) === upc12(x.upc)) || (x.asin && h.asin === x.asin) || (x.wid && h.wid === x.wid)) h.starred = on; });
      toast(on ? 'Added to Will Buy' : 'Removed from Will Buy'); drawHist(); }).catch(fail); }; });
}
function loadSet() {
  var c = CFG, f = function (id, l, v, mode) { return '<div><div class="lab">' + l + '</div><input class="in" id="' + id + '" inputmode="' + (mode || 'decimal') + '" value="' + esc(v) + '"></div>'; };
  $('vSet').innerHTML = sec('set', 'SETTINGS', '<div class="grid2">' + f('gRoi', 'ROI target %', r2(c.roi * 100)) + f('gMin', 'Min max-buy $', c.min_max_buy) +
    f('gLb', 'Max weight lb', c.lim.max_lb) + f('gL', 'Max length in', c.lim.max_l) + f('gW', 'Max width in', c.lim.max_w) + f('gH', 'Max height in', c.lim.max_h) +
    f('gTax', 'Sales tax on cost %', r2(c.tax * 100)) + f('gMo', 'WFS storage months', c.storage_months, 'numeric') + '</div>' +
    '<div class="lab" style="margin-top:8px">Default method</div><div class="seg" id="gM"><button data-m="wfs">WFS</button><button data-m="self">Seller Fulfilled</button></div>' +
    '<div class="lab" style="margin-top:8px">MultiSellerPro link (use {wid}, {upc} or {asin})</div><input class="in" id="gMsp" inputmode="url" value="' + esc(c.msp) + '" placeholder="https://…{wid}">' +
    '<div class="row"><button class="btn pri" id="gSave" style="flex:1">Save</button></div><div class="note">ROI target, Min max-buy and size limits are the same settings Walmart Scout uses.</div>' +
    '<div class="row" style="margin-top:10px"><button class="btn" id="gKey" style="flex:1">Copy scanner password</button></div><div class="note">For logging in the home-screen app or another phone: copy here, paste there.</div>');
  $('gKey').onclick = function () { copy(K, 'Password copied'); };
  var m = c.method;
  var segs = function () { document.querySelectorAll('#gM button').forEach(function (b) { b.classList.toggle('on', b.dataset.m === m); }); };
  document.querySelectorAll('#gM button').forEach(function (b) { b.onclick = function () { m = b.dataset.m; segs(); }; }); segs();
  wireSecs();
  $('gSave').onclick = function () {
    var n = function (id) { var v = parseFloat(String($(id).value).replace(',', '.')); return isNaN(v) ? null : Math.round(v * 100) / 100; };
    call('settings_save', {values: {roi_default: n('gRoi') != null ? n('gRoi') / 100 : null, min_max_buy: n('gMin'), max_lb: n('gLb'), max_l: n('gL'), max_w: n('gW'), max_h: n('gH'),
      scanner_tax: n('gTax') != null ? n('gTax') / 100 : null, scanner_storage_months: n('gMo'), scanner_method: m, msp_pattern: $('gMsp').value.trim()}})
      .then(function (cfg) { CFG = cfg; toast('Settings saved'); if (CARD) render(CARD); }).catch(fail);
  };
}

// ---------------------------------------------------------- password (remembered on this phone)
function askKey(msg) {
  show('vScan'); $('hello').style.display = 'none';
  $('out').innerHTML = sec('key', 'SCANNER PASSWORD', '<div class="note">' + esc(msg) + '</div><div class="row"><input class="in" id="kIn" type="password" autocomplete="current-password" style="flex:1" placeholder="Scanner password"><button class="btn pri" id="kOk">OK</button></div>');
  wireSecs();
  var ok = function () {
    var v = $('kIn').value.trim(); if (!v) return;
    $('kOk').disabled = true;
    call('settings', {}, v).then(function (cfg) { K = v; try { localStorage.setItem('wmr_k', v); } catch (e) {} boot(cfg); })
      .catch(function (e) { askKey(/Not authorized/.test(String(e.message)) ? 'That password is not right.' : String(e.message || e)); });
  };
  $('kOk').onclick = ok; $('kIn').onkeydown = function (e) { if (e.key === 'Enter') ok(); };
}
function boot(cfg) {
  CFG = cfg; STORES = cfg.stores || [];
  $('out').innerHTML = ''; $('hello').style.display = '';
  WMR_DECODE.prep();                      // load the barcode reader now, so the first scan is instant
}
if (!K) askKey('Type your scanner password once. This phone remembers it.');
else { busy('Loading…'); call('settings', {}).then(boot).catch(fail); }
</script>
